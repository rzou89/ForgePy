[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "forgepy-cli"
dynamic = ["version"]
description = "Create structured Python projects and prepare their development tooling."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
authors = [
    { name = "Rendy Zou" },
]
keywords = ["python", "project-generator", "cli", "windows", "linux"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/rzou89/ForgePy"
Repository = "https://github.com/rzou89/ForgePy"
Issues = "https://github.com/rzou89/ForgePy/issues"

[project.scripts]
forgepy = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "builders*",
    "cli*",
    "components*",
    "config*",
    "core*",
    "models*",
    "templates*",
]
exclude = ["tests*", "utils*"]

[tool.setuptools.dynamic]
version = { attr = "config.version.VERSION" }
