name: ForgePy CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI tooling
        run: python -m pip install setuptools build

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q components cli templates core config builders models tests

      - name: Run packaging and support tests
        run: python -m unittest tests.test_packaging -v

      - name: Build wheel and sdist
        if: matrix.python-version == '3.12'
        run: python -m build

      - name: Inspect wheel and sdist
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          python - <<'PY'
          import email
          import tarfile
          import zipfile
          from pathlib import Path

          from config.version import VERSION

          dist_path = Path("dist")
          wheels = tuple(dist_path.glob("*.whl"))
          sdists = tuple(dist_path.glob("*.tar.gz"))

          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          required_roots = {
              "main.py",
              "builders",
              "cli",
              "components",
              "config",
              "core",
              "models",
              "templates",
          }

          with zipfile.ZipFile(wheels[0]) as wheel:
              wheel_names = set(wheel.namelist())
              wheel_roots = {
                  name.split("/", 1)[0]
                  for name in wheel_names
              }

              assert required_roots <= wheel_roots, (
                  required_roots - wheel_roots
              )

              assert "cli/commands/__init__.py" in wheel_names
              assert "tests" not in wheel_roots
              assert "utils" not in wheel_roots

              metadata_name = next(
                  name
                  for name in wheel_names
                  if name.endswith(".dist-info/METADATA")
              )

              metadata = email.message_from_bytes(
                  wheel.read(metadata_name)
              )

              assert metadata["Version"] == VERSION
              assert (
                  metadata["Description-Content-Type"]
                  == "text/markdown"
              )
              assert metadata["License-Expression"] == "MIT"
              assert metadata["License-File"] == "LICENSE"

              license_name = next(
                  name
                  for name in wheel_names
                  if name.endswith(
                      ".dist-info/licenses/LICENSE"
                  )
              )

              assert wheel.read(license_name).startswith(
                  b"MIT License"
              )

              entry_points_name = next(
                  name
                  for name in wheel_names
                  if name.endswith(
                      ".dist-info/entry_points.txt"
                  )
              )

              entry_points = wheel.read(
                  entry_points_name
              ).decode("utf-8")

              assert "forgepy = main:main" in entry_points

          with tarfile.open(sdists[0], "r:gz") as sdist:
              sdist_names = set(sdist.getnames())

              relative_names = {
                  name.split("/", 1)[1]
                  for name in sdist_names
                  if "/" in name
              }

              sdist_roots = {
                  name.split("/", 1)[0]
                  for name in relative_names
              }

              assert required_roots <= sdist_roots, (
                  required_roots - sdist_roots
              )

              assert "pyproject.toml" in relative_names
              assert "README.md" in relative_names
              assert "CHANGELOG.md" in relative_names
              assert "LICENSE" in relative_names
              assert "cli/commands/__init__.py" in relative_names

              assert "tests" not in sdist_roots
              assert "utils" not in sdist_roots

              pkg_info_name = next(
                  name
                  for name in sdist_names
                  if name.count("/") == 1
                  and name.endswith("/PKG-INFO")
              )

              pkg_info_file = sdist.extractfile(
                  pkg_info_name
              )

              assert pkg_info_file is not None

              pkg_info = email.message_from_bytes(
                  pkg_info_file.read()
              )

              assert pkg_info["Version"] == VERSION
              assert (
                  pkg_info["Description-Content-Type"]
                  == "text/markdown"
              )
              assert pkg_info["License-Expression"] == "MIT"
              assert pkg_info["License-File"] == "LICENSE"
          PY

      - name: Install wheel and validate installed CLI
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          expected_version="$(
              python -c "from config.version import VERSION; print(VERSION)"
          )"

          wheel="$(
              python -c "
          from pathlib import Path
          wheels = tuple(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          print(wheels[0])
          "
          )"

          validation_root=".ci-venv"

          python -m venv "$validation_root"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
              validation_python="$validation_root/Scripts/python.exe"
              forgepy="$validation_root/Scripts/forgepy.exe"
          else
              validation_python="$validation_root/bin/python"
              forgepy="$validation_root/bin/forgepy"
          fi

          "$validation_python" -m pip install "$wheel" --no-deps

          unset PYTHONPATH

          mkdir -p .ci-smoke
          pushd .ci-smoke

          "../$forgepy" --help

          version_output="$("../$forgepy" version)"

          if [[ "$version_output" != *"ForgePy v$expected_version"* ]]; then
              echo "Unexpected ForgePy version:"
              echo "$version_output"
              exit 1
          fi

          "../$forgepy" list
          "../$forgepy" component list

          popd